<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Portal | NexMart</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}.table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:1rem}</style>
</head>
<body>
    <div id="backend-status" class="backend-status" hidden role="status"></div>
    <header class="mobile-dashboard-header">
        <button type="button" class="mobile-sidebar-toggle" id="mobile-sidebar-toggle" aria-label="Toggle Menu">
            <i class='bx bx-menu'></i>
        </button>
        <a href="/" class="logo">Nex<span>Mart</span></a>
        <div class="mobile-vendor-avatar">
            <i class='bx bxs-user-circle'></i>
        </div>
    </header>
    <div class="dashboard-container">
        <aside class="sidebar" id="dashboard-sidebar">
            <button type="button" class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Close menu">
                <i class='bx bx-x'></i>
            </button>
            <a href="/" class="logo">Nex<span>Mart</span></a>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" data-panel="dashboard-panel"><i class='bx bxs-dashboard'></i> Dashboard</a>
                <a href="#" class="menu-item" data-panel="orders-panel"><i class='bx bxs-cart-alt'></i> Orders</a>
            </nav>
            <a href="#" class="menu-item theme-toggle-btn" id="theme-toggle-btn"><i class='bx bx-sun'></i> Toggle Theme</a>
            <a href="#" id="logout-btn" class="menu-item"><i class='bx bx-log-out'></i> Logout</a>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>Vendor Dashboard</h1>
                <span>Welcome, <strong id="vendor-name">Vendor</strong></span>
            </header>

            <div id="dashboard-panel" class="panel active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3>Total Sales</h3>
                            <div class="value" id="stat-sales">$0</div>
                        </div>
                        <div class="stat-card-icon sales"><i class='bx bx-dollar'></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3>Active Orders</h3>
                            <div class="value" id="stat-orders">0</div>
                        </div>
                        <div class="stat-card-icon orders"><i class='bx bx-cart-alt'></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3>Products Sold</h3>
                            <div class="value" id="stat-sold">0</div>
                        </div>
                        <div class="stat-card-icon sold"><i class='bx bx-package'></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3>Rating</h3>
                            <div class="value" id="stat-rating">0 / 5</div>
                        </div>
                        <div class="stat-card-icon rating"><i class='bx bx-star'></i></div>
                    </div>
                </div>

                <div class="data-table-container">
                    <div class="table-header">
                        <h2>My Products</h2>
                        <button class="add-btn" id="add-product-btn"><i class='bx bx-plus'></i> Add Product</button>
                    </div>
                    <table>
                        <thead>
                            <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="products-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div id="orders-panel" class="panel">
                <div class="data-table-container">
                    <h2>Orders</h2>
                    <table>
                        <thead>
                            <tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Update</th></tr>
                        </thead>
                        <tbody id="orders-tbody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="product-modal">
        <div class="modal-box">
            <h2 id="modal-title">Add Product</h2>
            <button type="button" id="close-product-modal"><i class='bx bx-x'></i></button>
            <form id="product-form">
                <div class="form-group"><label>Name</label><input name="name" required></div>
                <div class="form-group"><label>Description</label><textarea name="description" required></textarea></div>
                <div class="form-group"><label>Price</label><input name="price" type="number" step="0.01" min="0" required></div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category" required>
                        <option>Electronics</option>
                        <option>Fashion</option>
                        <option>Home & Living</option>
                        <option>Sports</option>
                        <option>Beauty</option>
                    </select>
                </div>
                <div class="form-group"><label>Image URL</label><input name="image" type="url" required></div>
                <div class="form-group"><label>Stock</label><input name="stock" type="number" min="0" required></div>
                <button type="submit" class="cta-button">Save Product</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app-init.js"></script>
    <script src="/js/vendor.js"></script>
</body>
</html>
