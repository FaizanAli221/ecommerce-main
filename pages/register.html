<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NexMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="auth-page">
    <div id="backend-status" class="backend-status" hidden role="status"></div>
    <aside class="auth-brand">
        <div class="auth-brand-content">
            <a href="/" class="logo">Nex<span>Mart</span></a>
            <h1>Join the NexMart community</h1>
            <p>Create a customer account to shop, or register as a vendor and start selling today.</p>
            <ul class="auth-brand-features">
                <li><i class='bx bx-check'></i> Free vendor registration</li>
                <li><i class='bx bx-check'></i> Manage products & orders</li>
                <li><i class='bx bx-check'></i> Built-in reviews system</li>
            </ul>
        </div>
    </aside>
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo">Nex<span>Mart</span></a>
                <h2>Create account</h2>
                <p>Fill in your details to get started</p>
            </div>
            <form id="register-form">
                <div class="form-group">
                    <label>Register as</label>
                    <select id="userRole" required>
                        <option value="customer">Customer — Buy products</option>
                        <option value="vendor">Vendor — Sell products</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>First name</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label>Last name</label>
                        <input type="text" id="lastName" required>
                    </div>
                </div>
                <div class="form-group" id="storeNameGroup" style="display:none">
                    <label>Store name</label>
                    <input type="text" id="storeName" placeholder="Your brand name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label>Confirm password</label>
                    <input type="password" id="confirmPassword" minlength="6" required>
                </div>
                <button type="submit" class="cta-button">Create Account <i class='bx bx-user-plus'></i></button>
            </form>
            <div class="auth-footer">Have an account? <a href="/login">Sign in</a></div>
        </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/app-init.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
